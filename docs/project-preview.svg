<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">OnesToManys project architecture</title>
  <desc id="desc">A three-tier master-detail web architecture with presentation, application, and data layers.</desc>
  <rect width="1600" height="900" fill="#07131f"/>
  <style>.title{font:700 46px Arial,sans-serif;fill:#f4f8fb}.sub{font:24px Arial,sans-serif;fill:#93a9ba}.eyebrow{font:700 17px Arial,sans-serif;fill:#67e8d4;letter-spacing:1px}.card{fill:#0d2232;stroke:#24485f;stroke-width:2}.num{font:700 18px Arial,sans-serif;fill:#fff}.head{font:700 24px Arial,sans-serif;fill:#f4f8fb}.body{font:19px Arial,sans-serif;fill:#b8c7d2}.muted{font:17px Arial,sans-serif;fill:#7890a2}.flow{font:700 18px Arial,sans-serif;fill:#e6edf2}.route{font:15px monospace;fill:#bfe9e3}</style>
  <text class="title" x="85" y="95">ONES TO MANYS</text><text class="sub" x="85" y="140">Master-detail relationships across a three-tier web architecture</text>
  <rect x="1310" y="55" width="205" height="66" rx="30" fill="#153950" stroke="#2dd4bf" stroke-width="2"/><text class="eyebrow" x="1350" y="96">LEARNING LAB</text>
  <g transform="translate(65 210)"><rect class="card" width="450" height="220" rx="28"/><rect x="28" y="28" width="105" height="62" rx="15" fill="#147d98"/><text class="num" x="68" y="67">01</text><text class="head" x="50" y="130">PRESENTATION</text><text class="body" x="50" y="175">Vanilla JavaScript / React</text><text class="muted" x="50" y="207">List and detail views</text><path d="M455 110h40" stroke="#2dd4bf" stroke-width="5"/><path d="m495 110-12-8v16z" fill="#2dd4bf"/></g>
  <g transform="translate(575 210)"><rect class="card" width="450" height="220" rx="28"/><rect x="28" y="28" width="105" height="62" rx="15" fill="#16877e"/><text class="num" x="68" y="67">02</text><text class="head" x="50" y="130">APPLICATION</text><text class="body" x="50" y="175">REST API service</text><text class="muted" x="50" y="207">CRUD + relationship routes</text><path d="M455 110h40" stroke="#2dd4bf" stroke-width="5"/><path d="m495 110-12-8v16z" fill="#2dd4bf"/></g>
  <g transform="translate(1085 210)"><rect class="card" width="450" height="220" rx="28"/><rect x="28" y="28" width="105" height="62" rx="15" fill="#516278"/><text class="num" x="68" y="67">03</text><text class="head" x="50" y="130">DATA</text><text class="body" x="50" y="175">Relational database</text><text class="muted" x="50" y="207">Foreign keys + integrity</text></g>
  <text class="eyebrow" x="85" y="505">MASTER → DETAIL FLOW</text>
  <g transform="translate(65 535)"><rect class="card" width="330" height="92" rx="20"/><text class="flow" x="105" y="57">ORDER LIST</text><text x="410" y="58" fill="#2dd4bf" font-size="30">→</text><rect class="card" x="450" width="330" height="92" rx="20"/><text class="flow" x="535" y="57">ORDER DETAIL</text><text x="795" y="58" fill="#2dd4bf" font-size="30">→</text><rect class="card" x="835" width="330" height="92" rx="20"/><text class="flow" x="950" y="57">ITEM LIST</text><text x="1180" y="58" fill="#2dd4bf" font-size="30">→</text><rect class="card" x="1220" width="250" height="92" rx="20"/><text class="flow" x="1280" y="57">ITEM DETAIL</text></g>
  <rect x="65" y="690" width="1470" height="150" rx="28" fill="#091a27" stroke="#24485f" stroke-width="2"/><text class="muted" x="95" y="735" font-weight="700">REST RESOURCE PATTERN</text>
  <g fill="#143d57"><rect x="95" y="760" width="300" height="50" rx="12"/><rect x="410" y="760" width="330" height="50" rx="12"/><rect x="755" y="760" width="370" height="50" rx="12"/><rect x="1140" y="760" width="360" height="50" rx="12"/></g>
  <text class="route" x="155" y="792">GET /api/orders</text><text class="route" x="462" y="792">GET /api/orders/{id}</text><text class="route" x="795" y="792">GET /api/orders/{id}/items</text><text class="route" x="1163" y="792">GET /api/orders/{id}/items/{itemId}</text>
</svg>
